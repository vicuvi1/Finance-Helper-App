name: Desktop app

# Every push builds the Windows installer and a Linux AppImage (download them
# from the run's "Artifacts").
#
# Releases are automatic: when "version" in package.json is new (no tag
# v<version> yet) and the push is to the default branch, the builds are
# published as a GitHub Release. Installed desktop apps find it through
# "Check for updates" and update with one click.
on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          V=$(node -p "require('./package.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$V" > /dev/null; then
            echo "v$V already released"
            echo "release=false" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref_name }}" = "${{ github.event.repository.default_branch }}" ]; then
            echo "Releasing v$V"
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

  # The whole app, end to end (web screens, logging, undo, import, and the
  # desktop window really opening). A release is only built when this passes.
  e2e:
    # Pinned: Playwright can't install its browser on ubuntu-latest (26.04) yet.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: xvfb-run -a npm run e2e

  build:
    needs: [version, e2e]
    strategy:
      fail-fast: false
      # One at a time, so the first build creates the release and the next
      # one adds its files to it.
      max-parallel: 1
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build${{ needs.version.outputs.release == 'true' && ' and publish release' || '' }}
        run: npx electron-builder --publish ${{ needs.version.outputs.release == 'true' && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Unsigned builds: no code-signing certificate is configured.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: Finance-Helper-${{ runner.os }}
          path: |
            dist/*.exe
            dist/*.AppImage
            dist/latest*.yml
          if-no-files-found: error

  # The Android app (android/): built on every push; on a release it is added to the
  # GitHub Release as finance-helper.apk, so the link
  # releases/latest/download/finance-helper.apk always gives the newest one.
  # Signed with the keystore in the secrets FH_KEYSTORE_B64 + FH_KEYSTORE_PASSWORD
  # (the same key every time, so an update installs over the old app). Without
  # them it is signed with a throwaway key (fine to try, but updates need an uninstall).
  android:
    needs: [version, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Keystore
        env:
          KS: ${{ secrets.FH_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/fh.keystore"
            echo "FH_KEYSTORE=$RUNNER_TEMP/fh.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::No FH_KEYSTORE_B64 secret: the APK is signed with a throwaway key."
          fi
      - name: Build the APK
        working-directory: android
        env:
          FH_KEYSTORE_PASSWORD: ${{ secrets.FH_KEYSTORE_PASSWORD }}
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../finance-helper.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Finance-Helper-Android
          path: finance-helper.apk
          if-no-files-found: error
      - name: Add it to the release
        if: needs.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "v${{ needs.version.outputs.version }}" finance-helper.apk --clobber --repo "${{ github.repository }}"
