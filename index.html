<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Finance Helper</title>
  <meta name="description" content="Log every expense, split income 70/10/10/10, see where your money goes and hit your savings goal. Private and offline.">
  <meta name="theme-color" content="#0b0d10" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Finance">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/app.css">
  <script>
    // Apply the saved theme before first paint so there is no flash.
    try {
      const t = JSON.parse(localStorage.getItem('finance-helper.state') || '{}')?.settings?.theme;
      if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
    } catch {}
  </script>
</head>
<body>
  <main id="app" class="app" aria-live="polite"></main>

  <nav class="tabbar" aria-label="Sections">
    <span class="brand"><img src="icons/icon.svg" alt="" width="28" height="28">Finance Helper</span>
    <a href="#home" data-tab="home">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
      <span>Home</span>
    </a>
    <a href="#log" data-tab="log">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg>
      <span>Log</span>
    </a>
    <button type="button" class="fab" data-act="add" aria-label="Add a record">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      <span class="fab-label">New record</span>
    </button>
    <a href="#insights" data-tab="insights">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
      <span>Insights</span>
    </a>
    <a href="#settings" data-tab="settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      <span>Settings</span>
    </a>
    <p class="keys"><kbd>N</kbd> new record<br><kbd>/</kbd> search<br><kbd>1</kbd>–<kbd>4</kbd> sections</p>
  </nav>

  <div id="sheet-root"></div>
  <div id="toast" class="toast" role="status" hidden></div>

  <input type="file" id="file-csv" accept=".csv,.tsv,text/csv,text/plain" hidden>
  <input type="file" id="file-json" accept=".json,application/json" hidden>

  <noscript>Finance Helper needs JavaScript turned on.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
