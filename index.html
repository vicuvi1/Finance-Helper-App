<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Finance Helper</title>
  <meta name="description" content="Log every expense, split income 70/10/10/10, see where your money goes and hit your savings goal. Private and offline.">
  <meta name="theme-color" content="#0b0d10" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Finance">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/app.css">
  <script>
    // Apply the saved theme before first paint so there is no flash.
    try {
      const t = JSON.parse(localStorage.getItem('finance-helper.state') || '{}')?.settings?.theme || JSON.parse(localStorage.getItem('finance-helper.head') || '{}')?.theme;
      if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
    } catch {}
  </script>
</head>
<body>
  <main id="app" class="app" aria-live="polite"></main>

  <nav class="tabbar" aria-label="Sections">
    <span class="brand"><img src="icons/icon.svg" alt="" width="28" height="28"><span class="brand-name">Finance Helper</span></span>
    <div class="side-card" id="side-top"></div>
    <button type="button" class="fab" data-act="add" aria-label="Add a record">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      <span class="fab-label">New record</span>
    </button>
    <span class="nav-h">Overview</span>
    <a href="#home" data-tab="home" data-key="1" style="--nc:var(--gold)">
      <span class="ni"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg></span><span class="nl">Home</span><span class="nb" data-badge="home"></span>
    </a>
    <a href="#accounts" data-tab="accounts" data-key="3" style="--nc:var(--c1)">
      <span class="ni"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="M2.5 10h19M6.5 15h4"/></svg></span><span class="nl">Accounts</span><span class="nb" data-badge="accounts"></span>
    </a>
    <a href="#goals" data-tab="goals" data-key="4" class="nav-extra" style="--nc:var(--c4)">
      <span class="ni"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.2"/></svg></span><span class="nl">Goals</span><span class="nb" data-badge="goals"></span>
    </a>
    <span class="nav-h">Money</span>
    <a href="#log" data-tab="log" data-key="2" style="--nc:var(--c3)">
      <span class="ni"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg></span><span class="nl">Log</span><span class="nb" data-badge="log"></span>
    </a>
    <a href="#plan" data-tab="plan" data-key="5" class="nav-extra" style="--nc:var(--c7)">
      <span class="ni"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4.5" width="18" height="16" rx="2.5"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4M7.5 14h3M13.5 14h3M7.5 17.5h3"/></svg></span><span class="nl">Plan</span><span class="nb" data-badge="plan"></span>
    </a>
    <a href="#clients" data-tab="clients" data-key="6" class="nav-extra" style="--nc:var(--c2)">
      <span class="ni"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="7" width="18" height="13" rx="2.5"/><path d="M8.5 7V5.5A1.5 1.5 0 0 1 10 4h4a1.5 1.5 0 0 1 1.5 1.5V7M3 12.5h18M10.5 12.5v2h3v-2"/></svg></span><span class="nl">Clients</span><span class="nb" data-badge="clients"></span>
    </a>
    <span class="nav-h">Insights</span>
    <a href="#reports" data-tab="reports" data-key="7" class="nav-extra" style="--nc:var(--c6)">
      <span class="ni"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg></span><span class="nl">Reports</span><span class="nb" data-badge="reports"></span>
    </a>
    <div class="side-foot" id="side-bottom"></div>
    <a href="#settings" data-tab="settings" data-key="0" class="nav-extra" style="--nc:var(--muted)">
      <span class="ni"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></span><span class="nl">Settings</span><span class="nb" data-badge="settings"></span>
    </a>
    <button type="button" class="nav-more" data-act="more" aria-label="More sections">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg>
      <span>More</span>
    </button>
    <details class="keys"><summary>Keyboard shortcuts</summary><p><kbd>N</kbd> new record<br><kbd>/</kbd> search<br><kbd>1</kbd>–<kbd>7</kbd>, <kbd>0</kbd> sections<br><kbd>←</kbd> <kbd>→</kbd> months on Log<br><kbd>L</kbd> lock<br><kbd>Ctrl</kbd>+<kbd>Z</kbd> undo · <kbd>Ctrl</kbd>+<kbd>Y</kbd> redo</p></details>
  </nav>

  <div id="sheet-root"></div>
  <div id="lock-root" class="lock-root" hidden></div>
  <div id="toast" class="toast" role="status" hidden></div>
  <div id="print-root"></div>

  <input type="file" id="file-csv" accept=".xlsx,.csv,.tsv,text/csv,text/plain,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden>
  <input type="file" id="file-json" accept=".json,application/json" hidden>
  <input type="file" id="file-bank" accept=".csv,.xlsx,.txt,text/csv,text/plain,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden>

  <noscript>Finance Helper needs JavaScript turned on.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
